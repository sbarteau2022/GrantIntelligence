name: Check

# PR-triggered CI for the grant-intelligence Worker (src/) — typecheck + test.
# The marketing site (public/) has no build step to check. Deploys happen via
# Cloudflare's native Workers Builds git integration, not this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grant-worker:
    runs-on: ubuntu-latest
    name: grant-worker · typecheck + test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
