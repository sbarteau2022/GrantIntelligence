name: Deploy Grant Worker

# Auto-deploys grant-intelligence-worker on any push to main (or manual).
# The marketing site (public/) deploys separately via Cloudflare's own
# static-asset pipeline for the root wrangler.jsonc — this workflow only
# ever touches workers/grant-worker's own config.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-grant-intelligence-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    defaults:
      run:
        working-directory: workers/grant-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/grant-worker/package-lock.json
      - run: npm ci
      - name: Deploy
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
