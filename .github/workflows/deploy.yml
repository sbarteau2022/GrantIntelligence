name: Deploy Grant Intelligence Worker

# Explicit deploy path for the unified grantintelligence Worker (marketing
# assets + grant data layer + cron ingestion, one wrangler.jsonc). Runs
# instead of relying solely on Cloudflare's native Workers Builds git
# integration, which has been failing on this project (likely a build-token
# scope issue predating the D1/R2/AI/Cron bindings this config now needs) —
# this workflow uses the repo's own CLOUDFLARE_API_TOKEN secret, same as the
# rest of this account's other Workers repos.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-grantintelligence
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
